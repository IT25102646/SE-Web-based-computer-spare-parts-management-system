# ===================== ComSpare — Database Connection (SQL Server) =====================
# Replace username/password with YOUR local SQL Server login before running.
# If you use Windows Authentication in SSMS instead of a SQL login, see the
# alternative connection string commented out below.

spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS02;databaseName=ComSpareDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- Alternative: Windows Authentication (no username/password needed) ---
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ComSpareDB;integratedSecurity=true;encrypt=true;trustServerCertificate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true

server.port=8080
