# ComSpare - one database only: ComSpareDB
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=ComSpareDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# The tables are created by ComSpareDB.sql - Hibernate must NOT change them
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.error.include-message=always
server.port=8080

