<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Reports Dashboard</title></head>
<body>
<section>

    <div class="mb-4">
        <h2 class="mb-1">Reports Dashboard</h2>
        <p class="text-muted">Live reports from the ComSpare database - open any report to filter it or export it as PDF.</p>
    </div>

    <div th:each="g : ${groups}" class="mb-4">
        <h5 class="mb-3" th:text="${g.key}">Group</h5>
        <div class="row g-3">
            <div class="col-md-4 col-lg-3" th:each="c : ${g.value}">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title" th:text="${c.title()}">Title</h6>
                        <p class="card-text text-muted small flex-grow-1" th:text="${c.description()}">Description</p>
                        <a th:href="@{'/reports/' + ${c.name()}}" class="btn btn-sm btn-primary align-self-start">Open Report</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
