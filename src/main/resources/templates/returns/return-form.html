<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">

<head>
    <title th:text="${pageTitle}">
        Return Claim
    </title>
</head>

<body>

<section>

    <div class="mb-4">
        <h2 th:text="${pageTitle}">
            Return Claim
        </h2>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <form th:object="${returnRequest}"
          th:action="${returnRequest.id == null}
                    ? @{/returns/save}
                    : @{/returns/update/{id}(id=${returnRequest.id})}"
          method="post"
          class="card card-body">

        <div class="row g-3">

            <div class="col-md-6">

                <label class="form-label">
                    Customer Name
                </label>

                <input type="text"
                       th:field="*{customerName}"
                       class="form-control">

                <div class="text-danger"
                     th:errors="*{customerName}">
                </div>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Customer Contact
                </label>

                <input type="text"
                       th:field="*{customerContact}"
                       class="form-control">

                <div class="text-danger"
                     th:errors="*{customerContact}">
                </div>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Spare Part
                </label>

                <select th:field="*{part.id}"
                        class="form-select">

                    <option value="">
                        -- Select Part --
                    </option>

                    <option th:each="p : ${parts}"
                            th:value="${p.id}"
                            th:text="${p.productCode + ' - ' + p.name}">
                    </option>

                </select>

                <div class="text-danger"
                     th:errors="*{part}">
                </div>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Quantity
                </label>

                <input type="number"
                       min="1"
                       th:field="*{quantity}"
                       class="form-control">

                <div class="text-danger"
                     th:errors="*{quantity}">
                </div>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Claim Type
                </label>

                <select th:field="*{claimType}"
                        class="form-select">

                    <option value="RETURN">
                        RETURN
                    </option>

                    <option value="WARRANTY">
                        WARRANTY
                    </option>

                </select>

            </div>

            <div class="col-md-6">

                <label class="form-label">
                    Preferred Resolution
                </label>

                <select th:field="*{resolution}"
                        class="form-select">

                    <option value="">
                        -- Select --
                    </option>

                    <option value="REFUND">
                        REFUND
                    </option>

                    <option value="REPLACEMENT">
                        REPLACEMENT
                    </option>

                    <option value="REPAIR">
                        REPAIR
                    </option>

                    <option value="STORE_CREDIT">
                        STORE CREDIT
                    </option>

                </select>

            </div>

            <div class="col-12">

                <label class="form-label">
                    Return / Warranty Reason
                </label>

                <textarea th:field="*{returnReason}"
                          class="form-control"
                          rows="4"
                          placeholder="Explain why the item is being returned...">
                </textarea>

                <div class="text-danger"
                     th:errors="*{returnReason}">
                </div>

            </div>

        </div>

        <div class="mt-4">

            <button type="submit"
                    class="btn btn-primary">
                Save Claim
            </button>

            <a th:href="@{/returns}"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</section>

</body>
</html>
