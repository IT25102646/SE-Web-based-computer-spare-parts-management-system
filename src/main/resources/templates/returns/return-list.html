<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">

<head>
    <title>Returns & Warranty Claims</title>
</head>

<body>

<section>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Returns & Warranty Claims</h2>
            <p class="text-muted">
                Manage customer return and warranty requests.
            </p>
        </div>

        <a th:href="@{/returns/new}"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>
            New Claim
        </a>

    </div>

    <!-- Success message -->
    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <!-- Error message -->
    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <!-- Search -->
    <form method="get"
          th:action="@{/returns}"
          class="card card-body mb-4">

        <div class="row g-3">

            <div class="col-md-4">

                <label class="form-label">
                    Search customer
                </label>

                <input type="text"
                       name="search"
                       th:value="${search}"
                       class="form-control"
                       placeholder="Customer name/contact">

            </div>

            <div class="col-md-3">

                <label class="form-label">
                    Status
                </label>

                <select name="status"
                        class="form-select">

                    <option value="">All statuses</option>

                    <option value="PENDING"
                            th:selected="${status == 'PENDING'}">
                        Pending
                    </option>

                    <option value="APPROVED"
                            th:selected="${status == 'APPROVED'}">
                        Approved
                    </option>

                    <option value="REJECTED"
                            th:selected="${status == 'REJECTED'}">
                        Rejected
                    </option>

                    <option value="CANCELLED"
                            th:selected="${status == 'CANCELLED'}">
                        Cancelled
                    </option>

                </select>

            </div>

            <div class="col-md-3">

                <label class="form-label">
                    Claim type
                </label>

                <select name="claimType"
                        class="form-select">

                    <option value="">All types</option>

                    <option value="RETURN"
                            th:selected="${claimType == 'RETURN'}">
                        Return
                    </option>

                    <option value="WARRANTY"
                            th:selected="${claimType == 'WARRANTY'}">
                        Warranty
                    </option>

                </select>

            </div>

            <div class="col-md-2 d-flex align-items-end">

                <button class="btn btn-outline-primary w-100">
                    Search
                </button>

            </div>

        </div>

    </form>

    <!-- Claims table -->

    <div class="card">

        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Part</th>
                    <th>Qty</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="r : ${returns}">

                    <td th:text="${r.id}">
                        1
                    </td>

                    <td>
                        <strong th:text="${r.customerName}">
                            Customer
                        </strong>

                        <br>

                        <small class="text-muted"
                               th:text="${r.customerContact}">
                            Contact
                        </small>
                    </td>

                    <td th:text="${r.part.name}">
                        Keyboard
                    </td>

                    <td th:text="${r.quantity}">
                        1
                    </td>

                    <td th:text="${r.claimType}">
                        WARRANTY
                    </td>

                    <td>

                        <span class="badge bg-warning text-dark"
                              th:if="${r.status == 'PENDING'}">
                            PENDING
                        </span>

                        <span class="badge bg-success"
                              th:if="${r.status == 'APPROVED'}">
                            APPROVED
                        </span>

                        <span class="badge bg-danger"
                              th:if="${r.status == 'REJECTED'}">
                            REJECTED
                        </span>

                        <span class="badge bg-secondary"
                              th:if="${r.status == 'CANCELLED'}">
                            CANCELLED
                        </span>

                    </td>

                    <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">
                        Date
                    </td>

                    <td>

                        <a th:href="@{/returns/view/{id}(id=${r.id})}"
                           class="btn btn-sm btn-outline-primary">
                            View
                        </a>

                        <a th:if="${r.status == 'PENDING'}"
                           th:href="@{/returns/edit/{id}(id=${r.id})}"
                           class="btn btn-sm btn-outline-secondary">
                            Edit
                        </a>

                        <form th:if="${r.status == 'PENDING'}"
                              th:action="@{/returns/delete/{id}(id=${r.id})}"
                              method="post"
                              class="d-inline">

                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('Delete this claim?');">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(returns)}">

                    <td colspan="8"
                        class="text-center py-4 text-muted">

                        No return or warranty claims found.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>

</body>
</html>
