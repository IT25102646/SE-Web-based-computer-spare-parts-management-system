<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">

<head>
    <title>Returns &amp; Warranty Claims</title>
</head>

<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">Returns &amp; Warranty Claims</h2>
            <p class="text-muted mb-0">Manage customer returns and warranty claims</p>
        </div>
        <a th:href="@{/returns/new}" class="btn btn-accent">
            <i class="bi bi-plus-lg"></i> New Claim
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/returns}" class="row g-3">

                <div class="col-md-5">
                    <label class="form-label">Search Customer</label>
                    <input type="text" name="search" th:value="${search}" class="form-control"
                           placeholder="Enter customer name or contact">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
                        <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
                        <option value="REJECTED" th:selected="${status == 'REJECTED'}">Rejected</option>
                        <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Cancelled</option>
                    </select>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Return / Warranty Claims</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Part</th>
                    <th>Quantity</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${returns}">

                    <td th:text="${r.id}">1</td>

                    <td>
                        <strong th:text="${r.customerName}">Customer</strong>
                        <br>
                        <small class="text-muted" th:text="${r.customerContact}">Contact</small>
                    </td>

                    <td th:text="${r.part.name}">Keyboard</td>

                    <td th:text="${r.quantity}">1</td>

                    <td>
                        <span class="badge bg-secondary" th:text="${r.claimType}">WARRANTY</span>
                    </td>

                    <td>
<span th:text="${r.status}"
      th:class="${r.status == 'APPROVED'} ? 'badge badge-approved'
                : (${r.status == 'REJECTED'} ? 'badge badge-rejected'
                : (${r.status == 'CANCELLED'} ? 'badge bg-secondary' : 'badge badge-pending'))">
PENDING
</span>
                    </td>

                    <td class="text-end">
                        <a th:href="@{/returns/view/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary btn-icon" title="View">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:if="${r.status == 'PENDING'}" th:href="@{/returns/edit/{id}(id=${r.id})}"
                           class="btn btn-sm btn-outline-secondary btn-icon" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:if="${r.status == 'PENDING'}" th:action="@{/returns/delete/{id}(id=${r.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Are you sure you want to delete this claim?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger btn-icon" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(returns)}">
                    <td colspan="7" class="text-center py-5">
                        <h5>No return claims found</h5>
                        <p class="text-muted">Create your first return or warranty claim.</p>
                        <a th:href="@{/returns/new}" class="btn btn-accent">
                            <i class="bi bi-plus-lg"></i> New Claim
                        </a>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
