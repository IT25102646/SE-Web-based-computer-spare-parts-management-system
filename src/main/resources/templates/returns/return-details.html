<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Return Details</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 th:text="'Return / Warranty Claim #' + ${returnRequest.id}"></h2>
            <p class="text-muted mb-0" th:text="${#temporals.format(returnRequest.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
        </div>
        <a th:href="@{/returns}" class="btn btn-outline-secondary">Back to Claims</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card mb-3">
                <div class="card-header">Claim Information</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6"><strong>Customer:</strong><br><span th:text="${returnRequest.customerName}"></span></div>
                        <div class="col-md-6"><strong>Contact:</strong><br><span th:text="${returnRequest.customerContact}"></span></div>
                        <div class="col-md-6"><strong>Part:</strong><br><span th:text="${returnRequest.part.productCode + ' - ' + returnRequest.part.name}"></span></div>
                        <div class="col-md-3"><strong>Quantity:</strong><br><span th:text="${returnRequest.quantity}"></span></div>
                        <div class="col-md-3"><strong>Type:</strong><br><span th:text="${returnRequest.claimType}"></span></div>
                        <div class="col-12"><strong>Reason:</strong><br><span th:text="${returnRequest.returnReason}"></span></div>
                        <div class="col-md-6"><strong>Resolution:</strong><br><span th:text="${returnRequest.resolution ?: 'Not selected'}"></span></div>
                        <div class="col-md-6"><strong>Inventory processed:</strong><br><span th:text="${returnRequest.inventoryProcessed ? 'Yes' : 'No'}"></span></div>
                    </div>
                </div>
            </div>

            <div class="card" th:if="${returnRequest.decisionNotes != null}">
                <div class="card-header">Decision Notes</div>
                <div class="card-body" th:text="${returnRequest.decisionNotes}"></div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card mb-3">
                <div class="card-header">Current Status</div>
                <div class="card-body">
                    <span th:if="${returnRequest.status.name() == 'PENDING'}" class="badge badge-pending fs-6">Pending</span>
                    <span th:if="${returnRequest.status.name() == 'APPROVED'}" class="badge badge-approved fs-6">Approved</span>
                    <span th:if="${returnRequest.status.name() == 'REJECTED'}" class="badge badge-rejected fs-6">Rejected</span>
                    <span th:if="${returnRequest.status.name() == 'CANCELLED'}" class="badge bg-secondary fs-6">Cancelled</span>
                </div>
            </div>

            <div class="card" th:if="${returnRequest.status.name() == 'PENDING'}">
                <div class="card-header">Process Claim</div>
                <div class="card-body">
                    <form th:action="@{/returns/{id}/approve(id=${returnRequest.id})}" method="post" class="mb-3">
                        <label class="form-label">Approval Notes</label>
                        <textarea name="notes" class="form-control mb-2" rows="3" placeholder="Optional decision notes"></textarea>
                        <button type="submit" class="btn btn-success w-100" onclick="return confirm('Approve this claim?');">
                            <i class="bi bi-check-circle"></i> Approve Claim
                        </button>
                    </form>

                    <form th:action="@{/returns/{id}/reject(id=${returnRequest.id})}" method="post" class="mb-3">
                        <label class="form-label">Rejection Notes</label>
                        <textarea name="notes" class="form-control mb-2" rows="3" placeholder="Reason for rejection"></textarea>
                        <button type="submit" class="btn btn-outline-danger w-100" onclick="return confirm('Reject this claim?');">
                            <i class="bi bi-x-circle"></i> Reject Claim
                        </button>
                    </form>

                    <form th:action="@{/returns/{id}/cancel(id=${returnRequest.id})}" method="post">
                        <button type="submit" class="btn btn-outline-secondary w-100" onclick="return confirm('Cancel this claim?');">
                            Cancel Claim
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
