<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">

<head>
    <title>Return Claim Details</title>
</head>

<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Return Claim Details</h2>
            <p class="text-muted">Claim # <span th:text="${returnRequest.id}">1</span></p>
        </div>
        <a th:href="@{/returns}" class="btn btn-outline-secondary">Back to Claims</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">

        <div class="card-header">
            <h5 class="mb-0">Claim Information</h5>
        </div>

        <div class="card-body">
            <div class="row g-4">

                <div class="col-md-6">
                    <strong>Customer Name</strong>
                    <p th:text="${returnRequest.customerName}">Customer</p>
                </div>

                <div class="col-md-6">
                    <strong>Customer Contact</strong>
                    <p th:text="${returnRequest.customerContact}">Contact</p>
                </div>

                <div class="col-md-6">
                    <strong>Spare Part</strong>
                    <p th:text="${returnRequest.part.name}">Keyboard</p>
                </div>

                <div class="col-md-6">
                    <strong>Quantity</strong>
                    <p th:text="${returnRequest.quantity}">1</p>
                </div>

                <div class="col-md-6">
                    <strong>Claim Type</strong>
                    <p th:text="${returnRequest.claimType}">WARRANTY</p>
                </div>

                <div class="col-md-6">
                    <strong>Status</strong>
                    <p>
<span th:text="${returnRequest.status}"
      th:class="${returnRequest.status == 'APPROVED'} ? 'badge badge-approved'
                : (${returnRequest.status == 'REJECTED'} ? 'badge badge-rejected'
                : (${returnRequest.status == 'CANCELLED'} ? 'badge bg-secondary' : 'badge badge-pending'))">
PENDING
</span>
                    </p>
                </div>

                <div class="col-12">
                    <strong>Return Reason</strong>
                    <p th:text="${returnRequest.returnReason}">Reason</p>
                </div>

                <div class="col-md-6">
                    <strong>Resolution</strong>
                    <p th:text="${returnRequest.resolution}">REPLACEMENT</p>
                </div>

                <div class="col-md-6">
                    <strong>Inventory Processed</strong>
                    <p>
<span th:text="${returnRequest.inventoryProcessed} ? 'Yes' : 'No'"
      th:class="${returnRequest.inventoryProcessed} ? 'badge badge-in-stock' : 'badge bg-secondary'">
No
</span>
                    </p>
                </div>

                <div class="col-12" th:if="${returnRequest.decisionNotes != null}">
                    <strong>Decision Notes</strong>
                    <p th:text="${returnRequest.decisionNotes}">Notes</p>
                </div>

            </div>
        </div>

        <div class="card-footer d-flex gap-2 flex-wrap" th:if="${returnRequest.status == 'PENDING'}">

            <form th:action="@{/returns/approve/{id}(id=${returnRequest.id})}" method="post" class="d-flex gap-2">
                <input type="text" name="decisionNotes" class="form-control" placeholder="Decision notes">
                <button type="submit" class="btn btn-success text-nowrap">Approve Claim</button>
            </form>

            <form th:action="@{/returns/reject/{id}(id=${returnRequest.id})}" method="post">
                <input type="hidden" name="decisionNotes" value="Claim rejected after review">
                <button type="submit" class="btn btn-danger">Reject Claim</button>
            </form>

            <a th:href="@{/returns/edit/{id}(id=${returnRequest.id})}" class="btn btn-outline-secondary">Edit</a>

        </div>

    </div>

</section>
</body>
</html>
