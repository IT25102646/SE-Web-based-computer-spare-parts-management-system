<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">

<head>
    <title>Return Claim Details</title>
</head>

<body>

<section>

    <div class="d-flex justify-content-between mb-4">

        <div>
            <h2>Return Claim Details</h2>
            <p class="text-muted">
                Claim #<span th:text="${returnRequest.id}">1</span>
            </p>
        </div>

        <a th:href="@{/returns}"
           class="btn btn-secondary">
            Back
        </a>

    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <div class="card">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-6">
                    <strong>Customer</strong>
                    <p th:text="${returnRequest.customerName}">
                        Customer
                    </p>
                </div>

                <div class="col-md-6">
                    <strong>Contact</strong>
                    <p th:text="${returnRequest.customerContact}">
                        Contact
                    </p>
                </div>

                <div class="col-md-6">
                    <strong>Part</strong>
                    <p th:text="${returnRequest.part.name}">
                        Part
                    </p>
                </div>

                <div class="col-md-6">
                    <strong>Quantity</strong>
                    <p th:text="${returnRequest.quantity}">
                        1
                    </p>
                </div>

                <div class="col-md-6">
                    <strong>Claim Type</strong>
                    <p th:text="${returnRequest.claimType}">
                        WARRANTY
                    </p>
                </div>

                <div class="col-md-6">
                    <strong>Status</strong>
                    <p th:text="${returnRequest.status}">
                        PENDING
                    </p>
                </div>

                <div class="col-12">
                    <strong>Reason</strong>
                    <p th:text="${returnRequest.returnReason}">
                        Reason
                    </p>
                </div>

                <div class="col-md-6">
                    <strong>Resolution</strong>
                    <p th:text="${returnRequest.resolution}">
                        REPLACEMENT
                    </p>
                </div>

                <div class="col-md-6">
                    <strong>Inventory Processed</strong>
                    <p th:text="${returnRequest.inventoryProcessed}">
                        false
                    </p>
                </div>

                <div class="col-12"
                     th:if="${returnRequest.decisionNotes != null}">

                    <strong>Decision Notes</strong>

                    <p th:text="${returnRequest.decisionNotes}">
                        Notes
                    </p>

                </div>

            </div>

            <hr>

            <!-- Approve -->

            <div th:if="${returnRequest.status == 'PENDING'}">

                <form th:action="@{/returns/approve/{id}(id=${returnRequest.id})}"
                      method="post"
                      class="mb-2">

                    <label class="form-label">
                        Decision Notes
                    </label>

                    <textarea name="decisionNotes"
                              class="form-control mb-2"
                              placeholder="Optional decision notes">
                    </textarea>

                    <button class="btn btn-success">
                        Approve Claim
                    </button>

                </form>

                <form th:action="@{/returns/reject/{id}(id=${returnRequest.id})}"
                      method="post">

                    <input type="hidden"
                           name="decisionNotes"
                           value="Claim rejected after review">

                    <button class="btn btn-danger">
                        Reject Claim
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>

</body>
</html>
