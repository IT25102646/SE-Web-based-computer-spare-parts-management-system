<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Payment History</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Payment History</h2>
        <a href="/invoices" class="btn btn-outline-secondary">Back to Invoices</a>
    </div>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Date</th>
            <th>Invoice No</th>
            <th>Customer</th>
            <th>Method</th>
            <th>Reference</th>
            <th class="text-end">Amount (Rs.)</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${payments}">
            <td th:text="${#temporals.format(p.paymentDate,'yyyy-MM-dd HH:mm')}">2026-01-01</td>
            <td th:text="${p.invoice.invoiceNumber}">INV-00001</td>
            <td th:text="${p.invoice.customerName}">Customer</td>
            <td th:text="${p.paymentMethod}">CASH</td>
            <td th:text="${p.referenceNo}">-</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(p.amount,1,2)}">0.00</td>
            <td class="text-end">
                <a th:href="@{/invoices/{id}(id=${p.invoice.id})}"
                   class="btn btn-sm btn-outline-primary">View Invoice</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="7" class="text-center text-muted py-4">No payments recorded yet.</td>
        </tr>
        </tbody>
    </table>

</section>
</body>
</html>
