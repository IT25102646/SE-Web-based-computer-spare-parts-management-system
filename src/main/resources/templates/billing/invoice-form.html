<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>New Invoice</title></head>
<body>
<section>

    <h2 class="mb-4">Generate Invoice</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card" style="max-width: 700px;">
        <div class="card-body">
            <form th:action="@{/invoices/create}" method="post">
                <div class="mb-3">
                    <label class="form-label">Order</label>
                    <select name="orderId" class="form-select" required>
                        <option value="">-- Select an order --</option>
                        <option th:each="o : ${orders}" th:value="${o.id}"
                                th:text="${o.orderNumber + ' - ' + o.customerName + ' - Rs. ' + #numbers.formatDecimal(o.totalAmount,1,'COMMA',2,'POINT')}"></option>
                    </select>
                    <div class="form-text">Only orders that are not cancelled and have no invoice yet. The customer and total come from the order.</div>
                </div>
                <button type="submit" class="btn btn-primary">Generate Invoice</button>
                <a th:href="@{/invoices}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>

</section>
</body>
</html>
