<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>New Invoice</title></head>
<body>
<section>

    <h2 class="mb-4">Generate Invoice</h2>

    <div class="card">
        <div class="card-body">

            <form method="post" action="/invoices/create">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label">Order ID</label>
                    <input type="number" name="orderId" class="form-control" required>
                    <div class="form-text">The confirmed order this invoice is for.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>
                    <input type="text" name="customerName" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Amount (Rs.)</label>
                    <input type="number" name="totalAmount" step="0.01" min="0.01"
                           class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Generate Invoice</button>
                <a href="/invoices" class="btn btn-outline-secondary">Cancel</a>

            </form>

        </div>
    </div>

</section>
</body>
</html>
