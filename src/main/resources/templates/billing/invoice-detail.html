<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Invoice Detail</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${invoice.invoiceNumber}">INV-00001</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/invoices/{id}/edit(id=${invoice.id})}" class="btn btn-outline-secondary">Edit</a>
            <form th:action="@{/invoices/{id}/delete(id=${invoice.id})}" method="post"
                  onsubmit="return confirm('Delete this invoice and all its payments?');">
                <button type="submit" class="btn btn-outline-danger">Delete</button>
            </form>
            <a th:href="@{/invoices}" class="btn btn-outline-secondary">Back to Invoices</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title mb-3">Invoice Details</h5>
                <table class="table table-sm">
                    <tr><th>Order ID</th><td th:text="${invoice.orderId}"></td></tr>
                    <tr><th>Customer</th><td th:text="${invoice.customerName}"></td></tr>
                    <tr><th>Date</th><td th:text="${#temporals.format(invoice.invoiceDate,'yyyy-MM-dd HH:mm')}"></td></tr>
                    <tr><th>Total</th><td th:text="'Rs. ' + ${#numbers.formatDecimal(invoice.totalAmount,1,'COMMA',2,'POINT')}"></td></tr>
                    <tr><th>Paid</th><td th:text="'Rs. ' + ${#numbers.formatDecimal(invoice.amountPaid,1,'COMMA',2,'POINT')}"></td></tr>
                    <tr><th>Balance</th><td><strong th:text="'Rs. ' + ${#numbers.formatDecimal(balance,1,'COMMA',2,'POINT')}"></strong></td></tr>
                    <tr><th>Status</th><td>
                        <span th:text="${invoice.paymentStatus}"
                              th:class="${invoice.paymentStatus.name() == 'PAID'} ? 'badge badge-approved'
                                      : (${invoice.paymentStatus.name() == 'PARTIAL'} ? 'badge badge-pending' : 'badge badge-rejected')"></span>
                    </td></tr>
                </table>
            </div></div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card h-100"><div class="card-body">
                <h5 class="card-title mb-3">Record Payment</h5>

                <div th:if="${invoice.paymentStatus.name() == 'PAID'}" class="alert alert-success">This invoice is fully paid.</div>

                <form th:unless="${invoice.paymentStatus.name() == 'PAID'}" method="post"
                      th:action="@{/invoices/{id}/pay(id=${invoice.id})}">
                    <div class="mb-3">
                        <label class="form-label">Amount (Rs.)</label>
                        <input type="number" name="amount" step="0.01" min="0.01" th:max="${balance}"
                               th:value="${balance}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select name="method" class="form-select" required>
                            <option th:each="m : ${methods}" th:value="${m}" th:text="${m}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reference No (optional)</label>
                        <input type="text" name="referenceNo" maxlength="50" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Record Payment</button>
                </form>
            </div></div>
        </div>
    </div>

    <div class="card"><div class="card-body">
        <h5 class="card-title mb-3">Payments for this Invoice</h5>
        <table class="table table-sm align-middle">
            <thead><tr><th>Date</th><th>Method</th><th>Reference</th><th class="text-end">Amount (Rs.)</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${payments}">
                <td th:text="${#temporals.format(p.paymentDate,'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${p.paymentMethod}"></td>
                <td th:text="${p.referenceNo}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(p.amount,1,'COMMA',2,'POINT')}"></td>
                <td class="text-end text-nowrap">
                    <a th:href="@{/invoices/payments/{pid}/receipt(pid=${p.id})}" class="btn btn-sm btn-outline-secondary">Receipt</a>
                    <form method="post" th:action="@{/invoices/payments/{pid}/delete(pid=${p.id})}" class="d-inline"
                          onsubmit="return confirm('Remove this payment? The invoice total will be recalculated.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(payments)}"><td colspan="5" class="text-center text-muted py-3">No payments recorded yet.</td></tr>
            </tbody>
        </table>
    </div></div>

</section>
</body>
</html>
