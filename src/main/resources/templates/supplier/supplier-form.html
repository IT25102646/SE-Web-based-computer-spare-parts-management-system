<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Supplier Form</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Supplier</h1>

    <form th:action="@{/suppliers/save}"
          th:object="${supplier}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <label>Supplier Name</label>

        <input type="text"
               th:field="*{supplierName}"
               required>

        <label>Contact Person</label>

        <input type="text"
               th:field="*{contactPerson}">

        <label>Phone</label>

        <input type="text"
               th:field="*{phone}">

        <label>Email</label>

        <input type="email"
               th:field="*{email}">

        <label>Address</label>

        <textarea th:field="*{address}"
                  rows="4"></textarea>

        <label>Status</label>

        <select th:field="*{status}">

            <option value="ACTIVE">
                Active
            </option>

            <option value="INACTIVE">
                Inactive
            </option>

        </select>

        <button type="submit">
            Save Supplier
        </button>

        <a th:href="@{/suppliers}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
