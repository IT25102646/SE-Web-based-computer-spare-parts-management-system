<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Supplier Form</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>

<div class="container mt-4">

    <h1 th:text="${supplier.id == null ? 'Add Supplier' : 'Edit Supplier'}">
        Supplier
    </h1>

    <form th:action="@{/suppliers/save}"
          th:object="${supplier}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label>Supplier Name</label>

            <input type="text"
                   class="form-control"
                   th:field="*{supplierName}"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('supplierName')}"
                 th:errors="*{supplierName}">
            </div>

        </div>

        <div class="mb-3">

            <label>Contact Person</label>

            <input type="text"
                   class="form-control"
                   th:field="*{contactPerson}">

        </div>

        <div class="mb-3">

            <label>Phone</label>

            <input type="text"
                   class="form-control"
                   th:field="*{phone}">

        </div>

        <div class="mb-3">

            <label>Email</label>

            <input type="email"
                   class="form-control"
                   th:field="*{email}">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>

        </div>

        <div class="mb-3">

            <label>Address</label>

            <textarea class="form-control"
                      th:field="*{address}">
            </textarea>

        </div>

        <div class="mb-3">

            <label>Status</label>

            <select class="form-control"
                    th:field="*{status}">

                <option value="">
                    Select status
                </option>

                <option value="ACTIVE">
                    ACTIVE
                </option>

                <option value="INACTIVE">
                    INACTIVE
                </option>

            </select>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Save Supplier
        </button>

        <a th:href="@{/suppliers}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
