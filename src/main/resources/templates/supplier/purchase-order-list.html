<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Purchase Orders</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>

<div class="container mt-4">

    <h1>Purchase Order Management</h1>

    <div class="mb-3">

        <a th:href="@{/purchase-orders/new}"
           class="btn btn-primary">
            Create Purchase Order
        </a>

        <a th:href="@{/suppliers}"
           class="btn btn-secondary">
            Suppliers
        </a>

    </div>

    <table class="table table-bordered">

        <thead>

        <tr>
            <th>Order Number</th>
            <th>Supplier</th>
            <th>Order Date</th>
            <th>Expected Delivery</th>
            <th>Delivery Date</th>
            <th>Status</th>
            <th>Items</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="po : ${purchaseOrders}">

            <td th:text="${po.orderNumber}"></td>

            <td th:text="${po.supplier.supplierName}"></td>

            <td th:text="${po.orderDate}"></td>

            <td th:text="${po.expectedDeliveryDate}"></td>

            <td th:text="${po.deliveryDate}"></td>

            <td th:text="${po.status}"></td>

            <td>

                <div th:each="item : ${po.items}">

                    Part ID:
                    <span th:text="${item.partId}"></span>

                    |
                    Ordered:
                    <span th:text="${item.orderedQuantity}"></span>

                    |
                    Received:
                    <span th:text="${item.receivedQuantity}"></span>

                    <br>

                </div>

            </td>

            <td>

                <a th:if="${po.status != 'RECEIVED' and po.status != 'CANCELLED'}"
                   th:href="@{/purchase-orders/edit/{id}(id=${po.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <form th:if="${po.status != 'RECEIVED' and po.status != 'CANCELLED'}"
                      th:action="@{/purchase-orders/confirm/{id}(id=${po.id})}"
                      method="post"
                      style="display:inline;">

                    <button type="submit"
                            class="btn btn-success btn-sm"
                            onclick="return confirm('Confirm delivery? Inventory stock will be updated.');">
                        Confirm Delivery
                    </button>

                </form>

                <form th:if="${po.status != 'RECEIVED' and po.status != 'CANCELLED'}"
                      th:action="@{/purchase-orders/cancel/{id}(id=${po.id})}"
                      method="post"
                      style="display:inline;">

                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Cancel this purchase order?');">
                        Cancel
                    </button>

                </form>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(purchaseOrders)}">

            <td colspan="8"
                class="text-center">
                No purchase orders found.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
