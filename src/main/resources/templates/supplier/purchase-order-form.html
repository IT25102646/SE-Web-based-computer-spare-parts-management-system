<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Purchase Order Form</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>

<div class="container mt-4">

    <h1>Purchase Order</h1>

    <form th:action="@{/purchase-orders/save}"
          th:object="${purchaseOrder}"
          method="post">

        <input type="hidden"
               th:field="*{id}">

        <div class="mb-3">

            <label>Order Number</label>

            <input type="text"
                   class="form-control"
                   th:field="*{orderNumber}"
                   placeholder="Leave blank for automatic number">

        </div>

        <div class="mb-3">

            <label>Supplier</label>

            <select class="form-control"
                    th:field="*{supplier.id}"
                    required>

                <option value="">
                    Select Supplier
                </option>

                <option th:each="supplier : ${suppliers}"
                        th:value="${supplier.id}"
                        th:text="${supplier.supplierName}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Order Date</label>

            <input type="date"
                   class="form-control"
                   th:field="*{orderDate}">

        </div>

        <div class="mb-3">

            <label>Expected Delivery Date</label>

            <input type="date"
                   class="form-control"
                   th:field="*{expectedDeliveryDate}">

        </div>

        <div class="mb-3">

            <label>Status</label>

            <select class="form-control"
                    th:field="*{status}">

                <option value="PENDING">
                    PENDING
                </option>

                <option value="CANCELLED">
                    CANCELLED
                </option>

                <option value="RECEIVED">
                    RECEIVED
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Notes</label>

            <textarea class="form-control"
                      th:field="*{notes}"
                      rows="3">
            </textarea>

        </div>

        <h3>Purchase Order Items</h3>

        <table class="table table-bordered">

            <thead>

            <tr>
                <th>Part ID</th>
                <th>Ordered Quantity</th>
                <th>Received Quantity</th>
                <th>Unit Cost</th>
                <th>Action</th>
            </tr>

            </thead>

            <tbody id="itemsTable">

            <tr th:each="item, stat : ${purchaseOrder.items}">

                <td>

                    <input type="number"
                           class="form-control"
                           th:name="'items[' + ${stat.index} + '].partId'"
                           th:value="${item.partId}"
                           min="1"
                           required>

                </td>

                <td>

                    <input type="number"
                           class="form-control"
                           th:name="'items[' + ${stat.index} + '].orderedQuantity'"
                           th:value="${item.orderedQuantity}"
                           min="1"
                           required>

                </td>

                <td>

                    <input type="number"
                           class="form-control"
                           th:name="'items[' + ${stat.index} + '].receivedQuantity'"
                           th:value="${item.receivedQuantity}"
                           min="0">

                </td>

                <td>

                    <input type="number"
                           class="form-control"
                           th:name="'items[' + ${stat.index} + '].unitCost'"
                           th:value="${item.unitCost}"
                           min="0"
                           step="0.01">

                </td>

                <td>

                    <button type="button"
                            class="btn btn-danger"
                            onclick="removeItem(this)">
                        Remove
                    </button>

                </td>

            </tr>

            </tbody>

        </table>

        <button type="button"
                class="btn btn-success"
                onclick="addItem()">
            + Add Item
        </button>

        <br><br>

        <button type="submit"
                class="btn btn-primary">
            Save Purchase Order
        </button>

        <a th:href="@{/purchase-orders}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

<script>

    let itemIndex =
        document.querySelectorAll("#itemsTable tr").length;

    function addItem() {

        const table =
            document.getElementById("itemsTable");

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>
                <input type="number"
                       class="form-control"
                       name="items[${itemIndex}].partId"
                       min="1"
                       required>
            </td>

            <td>
                <input type="number"
                       class="form-control"
                       name="items[${itemIndex}].orderedQuantity"
                       min="1"
                       required>
            </td>

            <td>
                <input type="number"
                       class="form-control"
                       name="items[${itemIndex}].receivedQuantity"
                       value="0"
                       min="0">
            </td>

            <td>
                <input type="number"
                       class="form-control"
                       name="items[${itemIndex}].unitCost"
                       min="0"
                       step="0.01">
            </td>

            <td>
                <button type="button"
                        class="btn btn-danger"
                        onclick="removeItem(this)">
                    Remove
                </button>
            </td>
        `;

        table.appendChild(row);

        itemIndex++;
    }

    function removeItem(button) {

        button.closest("tr").remove();

    }

</script>

</body>
</html>
