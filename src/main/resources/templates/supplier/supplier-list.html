<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Supplier Management</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

<body>

<div class="container mt-4">

    <h1>Supplier Management</h1>

    <div class="mb-3">

        <a th:href="@{/suppliers/new}"
           class="btn btn-primary">
            Add Supplier
        </a>

        <a th:href="@{/purchase-orders}"
           class="btn btn-secondary">
            Purchase Orders
        </a>

        <a th:href="@{/supplier-performance}"
           class="btn btn-info">
            Supplier Performance
        </a>

    </div>

    <table class="table table-bordered">

        <thead>

        <tr>
            <th>ID</th>
            <th>Supplier Name</th>
            <th>Contact Person</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="supplier : ${suppliers}">

            <td th:text="${supplier.id}"></td>

            <td th:text="${supplier.supplierName}"></td>

            <td th:text="${supplier.contactPerson}"></td>

            <td th:text="${supplier.phone}"></td>

            <td th:text="${supplier.email}"></td>

            <td th:text="${supplier.address}"></td>

            <td th:text="${supplier.status}"></td>

            <td>

                <a th:href="@{/suppliers/edit/{id}(id=${supplier.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/suppliers/delete/{id}(id=${supplier.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this supplier?');">
                    Delete
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(suppliers)}">

            <td colspan="8" class="text-center">
                No suppliers found.
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
