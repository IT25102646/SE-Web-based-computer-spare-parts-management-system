<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Suppliers</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Supplier Management</h2>
        <a th:href="@{/suppliers/new}" class="btn btn-accent"><i class="bi bi-plus-lg"></i> Add Supplier</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Supplier Name</th>
                    <th>Contact Person</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="supplier : ${suppliers}">
                    <td th:text="${supplier.id}"></td>
                    <td th:text="${supplier.supplierName}"></td>
                    <td th:text="${supplier.contactPerson}"></td>
                    <td th:text="${supplier.phone}"></td>
                    <td th:text="${supplier.email}"></td>
                    <td th:text="${supplier.address}"></td>
                    <td>
<span th:text="${supplier.status}"
      th:class="${supplier.status == 'ACTIVE'} ? 'badge badge-approved' : 'badge badge-rejected'">ACTIVE</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/suppliers/edit/{id}(id=${supplier.id})}" class="btn btn-sm btn-outline-secondary btn-icon" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{/suppliers/delete/{id}(id=${supplier.id})}" class="btn btn-sm btn-outline-danger btn-icon" title="Delete"
                           onclick="return confirm('Delete this supplier?');">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(suppliers)}">
                    <td colspan="8" class="text-center py-4">No suppliers found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
