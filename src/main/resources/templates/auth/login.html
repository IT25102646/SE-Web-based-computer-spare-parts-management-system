<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - ComSpare</title>
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>
<body class="login-page">
<main class="login-card" style="margin:0;padding:32px">
    <h1>Sign in to ComSpare</h1>
    <p class="sub">Use the account your administrator created for you.</p>

    <div class="alert error" th:if="${param.error}" role="alert" style="margin-top:16px">
        Sign-in failed. Check your email and password, or ask an Admin whether your account is still active.
    </div>
    <div class="alert success" th:if="${param.logout}" style="margin-top:16px">You have been signed out.</div>

    <form th:action="@{/login}" method="post" class="form-grid">
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="username" required autofocus>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Sign in</button>
    </form>
</main>
</body>
</html>
