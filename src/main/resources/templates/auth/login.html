<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LankaTech Spare Parts</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/theme.css}" href="../static/css/theme.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center" style="min-height:100vh; background-color: var(--lt-bg);">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="text-center mb-4">
                <i class="bi bi-cpu-fill" style="font-size:2.5rem; color: var(--lt-navy);"></i>
                <h2 class="mt-2 mb-0" style="color: var(--lt-navy);">LankaTech <span class="fw-light">Spare Parts</span></h2>
                <p class="text-muted mb-0">ComSpare Inventory &amp; Sales Management</p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h5 class="text-center mb-4">Sign in to your account</h5>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Invalid email or password.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-success">
                        You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="username" class="form-control" placeholder="Enter email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Login</button>

                    </form>

                </div>
            </div>

            <p class="text-center text-muted small mt-3">© 2026 LankaTech Computer Supplies (Pvt) Ltd</p>

        </div>
    </div>
</div>

</body>
</html>
