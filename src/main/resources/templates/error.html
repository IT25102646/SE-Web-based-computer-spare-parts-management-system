<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Error</title></head>
<body>
<section>
    <div class="card mx-auto" style="max-width: 600px;">
        <div class="card-body text-center py-5">
            <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>
            <h4 class="mt-3">Something went wrong</h4>
            <p class="text-muted mb-1" th:if="${status != null}" th:text="'Error ' + ${status}"></p>
            <p th:text="${message != null and !#strings.isEmpty(message)} ? ${message} : 'The page could not be shown, or you do not have access to it.'"></p>
            <a th:href="@{/}" class="btn btn-primary">Back to home</a>
        </div>
    </div>
</section>
</body>
</html>
