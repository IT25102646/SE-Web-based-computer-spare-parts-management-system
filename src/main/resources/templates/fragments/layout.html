<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | LankaTech Spare Parts'">LankaTech Spare Parts</title>

    <!-- Bootstrap 5 (free, via CDN) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Shared theme overrides -->
    <link th:href="@{/css/theme.css}" href="../static/css/theme.css" rel="stylesheet">
</head>
<body>

<!-- ===================== NAVBAR (fragment: navbar) ===================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-cpu-fill me-2"></i>LankaTech <span class="fw-light">Spare Parts</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/parts}"><i class="bi bi-box-seam me-1"></i>Inventory</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}"><i class="bi bi-cart-check me-1"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/suppliers}"><i class="bi bi-truck me-1"></i>Suppliers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/invoices}"><i class="bi bi-receipt me-1"></i>Billing</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/returns}"><i class="bi bi-arrow-return-left me-1"></i>Returns</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reports}"><i class="bi bi-graph-up me-1"></i>Reports</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/users}"><i class="bi bi-people me-1"></i>Users</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i><span th:text="${#authentication?.name} ?: 'Account'">Account</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}">Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/logout}">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===================== FOOTER (fragment: footer) ===================== -->
<footer th:fragment="footer" class="app-footer text-center py-3 mt-5">
    <small>&copy; 2026 LankaTech Computer Supplies (Pvt) Ltd &mdash; Spare Parts Management System</small>
</footer>

<!-- ===================== PAGE WRAPPER (fragment: page) ===================== -->
<!--
  HOW TO USE THIS LAYOUT IN YOUR OWN PAGE:

  <html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
  <head><title>Part Inventory</title></head>
  <body>
    <section>
        ...your page content here...
    </section>
  </body>
  </html>
-->
<th:block th:fragment="page(title, content)">
    <div th:replace="~{this :: navbar}"></div>

    <main class="container-fluid px-4 py-4">
        <div th:replace="${content}"></div>
    </main>

    <div th:replace="~{this :: footer}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
