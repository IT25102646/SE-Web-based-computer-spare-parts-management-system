<!DOCTYPE html>
<!--
  Every page uses it like this:
  <html xmlns:th="http://www.thymeleaf.org"
        th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
  <head><title>My page</title></head>
  <body><section> ...content AND scripts go INSIDE the section... </section></body>
  </html>
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Comspare Spare Parts</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container-fluid px-4 py-4 flex-grow-1">
    <div th:replace="${content}"></div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
