<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>User form</title></head>
<body>
<section>

    <h2 th:text="${user.id == null ? 'Add User' : 'Edit User'}">Add User</h2>

    <div class="card" style="max-width:600px;">
        <div class="card-body">

            <form th:action="${user.id == null} ? @{/users/save} : @{/users/update/{id}(id=${user.id})}"
                  method="post" th:object="${user}">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{passwordHash}" class="form-control" th:required="${user.id == null}">
                    <small class="text-muted" th:if="${user.id != null}">Leave blank to keep the existing password.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="roleId" class="form-select" required>
                        <option value="">Select Role</option>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.roleName}"
                                th:selected="${user.role != null and user.role.id == role.id}"></option>
                    </select>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-accent">Save</button>
                    <a th:href="@{/users}" class="btn btn-outline-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </div>

</section>
</body>
</html>
