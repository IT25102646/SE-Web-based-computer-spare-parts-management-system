<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ComSpare - User Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="mb-4"
                        th:text="${user.id == null ? 'Add User' : 'Edit User'}">
                    </h2>

                    <form th:action="${user.id == null}
                                      ? @{/users/save}
                                      : @{/users/update/{id}(id=${user.id})}"
                          method="post"
                          th:object="${user}">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   th:field="*{passwordHash}"
                                   class="form-control"
                                   th:required="${user.id == null}">

                            <small class="text-muted"
                                   th:if="${user.id != null}">
                                Leave blank to keep the existing password.
                            </small>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Role
                            </label>

                            <select name="roleId"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Role
                                </option>

                                <option th:each="role : ${roles}"
                                        th:value="${role.id}"
                                        th:text="${role.roleName}"
                                        th:selected="${user.role != null
                                            and user.role.id == role.id}">
                                </option>

                            </select>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            Save
                        </button>

                        <a th:href="@{/users}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
