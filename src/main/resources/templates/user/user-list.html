<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - ComSpare</title>
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>
<body>
<header th:replace="~{fragments/user-nav :: nav}"></header>
<main>
    <div class="page-head">
        <div>
            <h1>User accounts</h1>
            <p class="sub">Create accounts, change roles, and deactivate people who have left.</p>
        </div>
        <a class="btn" th:href="@{/users/new}">Add user</a>
    </div>

    <div class="alert success" th:if="${success}" th:text="${success}" role="status"></div>
    <div class="alert error"   th:if="${error}"   th:text="${error}"   role="alert"></div>

    <div class="panel">
        <div class="toolbar">
            <input type="search" id="filter" placeholder="Filter by name, email or role" aria-label="Filter users">
        </div>
        <div class="table-wrap">
            <table id="userTable">
                <thead>
                <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}" th:classappend="${!u.active} ? 'inactive'">
                    <td th:text="${u.name}">Kasun Silva</td>
                    <td th:text="${u.email}">kasun@comspare.lk</td>
                    <td><span class="badge" th:classappend="${u.role.roleName == 'Admin'} ? 'admin'"
                              th:text="${u.role.roleName}">Store Keeper</span></td>
                    <td>
                        <span class="badge on"  th:if="${u.active}">Active</span>
                        <span class="badge off" th:unless="${u.active}">Deactivated</span>
                    </td>
                    <td class="actions">
                        <a class="btn ghost small" th:href="@{/users/{id}/edit(id=${u.id})}">Edit</a>
                        <form th:if="${u.active}" th:action="@{/users/{id}/deactivate(id=${u.id})}" method="post"
                              onsubmit="return confirm('Deactivate this account? They will no longer be able to log in. Their history is kept.');">
                            <button type="submit" class="btn danger small">Deactivate</button>
                        </form>
                        <form th:unless="${u.active}" th:action="@{/users/{id}/activate(id=${u.id})}" method="post">
                            <button type="submit" class="btn ghost small">Reactivate</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty" th:if="${#lists.isEmpty(users)}">No users yet. Add the first account.</div>
    </div>
</main>
<script>
    document.getElementById('filter').addEventListener('input', function () {
        var q = this.value.toLowerCase();
        document.querySelectorAll('#userTable tbody tr').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
        });
    });
</script>
</body>
</html>
