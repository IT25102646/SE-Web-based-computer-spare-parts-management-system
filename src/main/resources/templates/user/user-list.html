<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Users</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">User Management</h2>
        <div>
            <a th:href="@{/users/new}" class="btn btn-accent"><i class="bi bi-plus-lg"></i> Add User</a>
            <a th:href="@{/roles}" class="btn btn-outline-secondary"><i class="bi bi-shield-lock"></i> Roles</a>
            <a th:href="@{/users/audit}" class="btn btn-outline-secondary"><i class="bi bi-clock-history"></i> Audit Trail</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="user : ${users}" th:classappend="${!user.active} ? 'text-muted'">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role.roleName}"></td>
                    <td>
                        <span th:if="${user.active}" class="badge badge-approved">Active</span>
                        <span th:if="${!user.active}" class="badge bg-secondary">Deactivated</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-secondary btn-icon" title="Edit"><i class="bi bi-pencil"></i></a>
                        <form th:if="${user.active}" th:action="@{/users/deactivate/{id}(id=${user.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Deactivate this user? They will no longer be able to log in.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Deactivate</button>
                        </form>
                        <form th:if="${!user.active}" th:action="@{/users/reactivate/{id}(id=${user.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">Reactivate</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="6" class="text-center py-4">No users found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
