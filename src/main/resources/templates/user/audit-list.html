<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit trail - ComSpare</title>
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>
<body>
<header th:replace="~{fragments/user-nav :: nav}"></header>
<main>
    <div class="page-head">
        <div>
            <h1>Audit trail</h1>
            <p class="sub">Who did what, and when. Entries cannot be edited or deleted by anyone.</p>
        </div>
    </div>

    <div class="panel">
        <form class="toolbar" th:action="@{/audit}" method="get">
            <input type="search" name="q" th:value="${q}" placeholder="Search by person, action or record" aria-label="Search audit trail">
            <button type="submit" class="btn">Search</button>
            <a class="btn ghost" th:href="@{/audit}" th:if="${!#strings.isEmpty(q)}">Clear</a>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Before</th><th>After</th></tr>
                </thead>
                <tbody>
                <tr th:each="l : ${logs}">
                    <td class="mono" th:text="${#temporals.format(l.loggedAt, 'yyyy-MM-dd HH:mm:ss')}">2026-10-03 11:09:00</td>
                    <td th:text="${l.performedBy}">admin@comspare.lk</td>
                    <td><span class="badge"
                              th:classappend="${#strings.contains(l.action,'FAILED') or #strings.contains(l.action,'DEACTIVATED')} ? 'bad'
                                  : (${#strings.contains(l.action,'ROLE') or #strings.contains(l.action,'PASSWORD')} ? 'warn' : '')"
                              th:text="${l.action}">USER_CREATED</span></td>
                    <td th:text="${l.targetRecord}">User #4</td>
                    <td th:text="${l.oldValue}">-</td>
                    <td th:text="${l.newValue}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="empty" th:if="${#lists.isEmpty(logs)}">No matching entries.</div>
    </div>
</main>
</body>
</html>
