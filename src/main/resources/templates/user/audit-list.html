<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Audit Trail</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Audit Trail</h2>
        <a th:href="@{/users}" class="btn btn-outline-secondary">Back to Users</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Table</th>
                    <th>Record ID</th>
                    <th>Old Value</th>
                    <th>New Value</th>
                    <th>Timestamp</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${log.id}"></td>
                    <td th:text="${log.user != null ? log.user.email : 'System'}"></td>
                    <td th:text="${log.action}"></td>
                    <td th:text="${log.tableName}"></td>
                    <td th:text="${log.recordId}"></td>
                    <td th:text="${log.oldValue}"></td>
                    <td th:text="${log.newValue}"></td>
                    <td th:text="${#temporals.format(log.timestamp,'yyyy-MM-dd HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(logs)}">
                    <td colspan="8" class="text-center py-4">No audit records found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
