<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ComSpare - Audit Trail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Audit Trail</h2>

        <a th:href="@{/users}"
           class="btn btn-secondary">
            Back to Users
        </a>

    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>User</th>
            <th>Action</th>
            <th>Table</th>
            <th>Record ID</th>
            <th>Old Value</th>
            <th>New Value</th>
            <th>Timestamp</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="log : ${logs}">

            <td th:text="${log.id}"></td>

            <td th:text="${log.user != null
                          ? log.user.email
                          : 'System'}">
            </td>

            <td th:text="${log.action}"></td>

            <td th:text="${log.tableName}"></td>

            <td th:text="${log.recordId}"></td>

            <td th:text="${log.oldValue}"></td>

            <td th:text="${log.newValue}"></td>

            <td th:text="${log.timestamp}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
