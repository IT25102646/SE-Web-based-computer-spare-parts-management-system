<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>My profile</title></head>
<body>
<section>

    <h2 class="mb-1">My profile</h2>
    <p class="text-muted">Your account details and password.</p>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card mb-4" style="max-width:560px;"><div class="card-body">
        <table class="table table-sm mb-0">
            <tr><th style="width:30%">Name</th><td th:text="${me.name}"></td></tr>
            <tr><th>Email</th><td th:text="${me.email}"></td></tr>
            <tr><th>Role</th><td><span class="badge bg-secondary" th:text="${me.role.roleName}"></span></td></tr>
        </table>
    </div></div>

    <div class="card" style="max-width:560px;"><div class="card-body">
        <h5 class="mb-3">Change password</h5>
        <form th:action="@{/profile/password}" method="post">
            <div class="mb-3">
                <label class="form-label" for="currentPassword">Current password</label>
                <input type="password" id="currentPassword" name="currentPassword" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword" class="form-control" minlength="8" autocomplete="new-password" required>
                <div class="form-text">At least 8 characters, with a letter and a number.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Update password</button>
        </form>
    </div></div>

</section>
</body>
</html>
