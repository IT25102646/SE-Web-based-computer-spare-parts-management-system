<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Inventory</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Inventory</h2>
        <a th:href="@{/parts/add}" class="btn btn-accent">
            <i class="bi bi-plus-lg"></i> Add spare part
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <div th:if="${lowStockCount > 0}" class="alert alert-warning d-flex align-items-center">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${lowStockCount} + ' part(s) are at or below their reorder level.'"></span>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/parts}" method="get" class="d-flex gap-2">
                <input type="text" name="search" class="form-control" placeholder="Search by code, name, brand, category"
                       th:value="${searchTerm}">
                <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Search</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Brand</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Location</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="part : ${parts}">
                    <td th:text="${part.productCode}"></td>
                    <td th:text="${part.name}"></td>
                    <td th:text="${part.category}"></td>
                    <td th:text="${part.brand}"></td>
                    <td th:text="'Rs. ' + ${part.price}"></td>
                    <td th:text="${part.stockQuantity}"></td>
                    <td>
                        <span th:if="${part.outOfStock}" class="badge badge-out-stock">Out of stock</span>
                        <span th:if="${part.lowStock and !part.outOfStock}" class="badge badge-low-stock">Low stock</span>
                        <span th:if="${!part.lowStock}" class="badge badge-in-stock">In stock</span>
                    </td>
                    <td th:text="${part.location}"></td>
                    <td class="text-end">
                        <a th:href="@{/parts/history/{id}(id=${part.id})}" class="btn btn-sm btn-outline-secondary btn-icon" title="View history">
                            <i class="bi bi-clock-history"></i>
                        </a>
                        <a th:href="@{/parts/adjust/{id}(id=${part.id})}" class="btn btn-sm btn-outline-secondary btn-icon" title="Adjust stock">
                            <i class="bi bi-sliders"></i>
                        </a>
                        <a th:href="@{/parts/edit/{id}(id=${part.id})}" class="btn btn-sm btn-outline-secondary btn-icon" title="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/parts/delete/{id}(id=${part.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this part?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger btn-icon" title="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(parts)}">
                    <td colspan="9" class="text-center py-4">No spare parts found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
