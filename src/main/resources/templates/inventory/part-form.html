<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Spare part form</title></head>
<body>
<section>

    <h2 th:text="${pageTitle}">Add spare part</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body">
            <form th:action="${part.id != null} ? @{/parts/update/{id}(id=${part.id})} : @{/parts/save}"
                  th:object="${part}" method="post">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Product code</label>
                        <input type="text" class="form-control" th:field="*{productCode}"
                               th:readonly="${part.id != null}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('productCode')}"
                             th:errors="*{productCode}"></div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Part name</label>
                        <input type="text" class="form-control" th:field="*{name}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Category</label>
                        <input type="text" class="form-control" th:field="*{category}"
                               placeholder="RAM, SSD, Motherboard...">
                        <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Brand</label>
                        <input type="text" class="form-control" th:field="*{brand}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Model</label>
                        <input type="text" class="form-control" th:field="*{model}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Price (Rs.)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{price}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Stock quantity</label>
                        <input type="number" class="form-control" th:field="*{stockQuantity}"
                               th:readonly="${part.id != null}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                        <div class="form-text" th:if="${part.id != null}">Use "Adjust stock" from the inventory list to change quantity after creation.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Reorder level</label>
                        <input type="number" class="form-control" th:field="*{reorderLevel}">
                        <div class="text-danger small" th:if="${#fields.hasErrors('reorderLevel')}" th:errors="*{reorderLevel}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Storage location</label>
                        <input type="text" class="form-control" th:field="*{location}"
                               placeholder="e.g. Shelf A3">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Compatible with</label>
                        <input type="text" class="form-control" th:field="*{compatibleWith}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Specifications</label>
                        <textarea class="form-control" rows="3" th:field="*{specifications}"></textarea>
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-accent">Save</button>
                    <a th:href="@{/parts}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</section>
</body>
</html>
