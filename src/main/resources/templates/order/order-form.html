<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Order Form</title></head>
<body>
<section>

    <h2 class="mb-3" th:text="${order.id == null ? 'Create Order' : 'Edit Order'}">Create Order</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/orders/save}" th:object="${order}" method="post" onsubmit="return prepareSubmit();">
        <input type="hidden" th:field="*{id}">

        <div class="card mb-4"><div class="card-body"><div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Order Number</label>
                <input type="text" th:field="*{orderNumber}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('orderNumber')}" th:errors="*{orderNumber}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Customer Name</label>
                <input type="text" th:field="*{customerName}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Customer Email</label>
                <input type="email" th:field="*{customerEmail}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Order Date</label>
                <input type="datetime-local" th:field="*{orderDate}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('orderDate')}" th:errors="*{orderDate}"></div>
            </div>
        </div></div></div>

        <div class="card mb-4">
            <div class="card-header">Add Spare Parts</div>
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-8">
                        <label class="form-label">Select Part</label>
                        <select id="partSelect" class="form-select">
                            <option value="">-- Select a spare part --</option>
                            <option th:each="p : ${parts}" th:value="${p.id}"
                                    th:attr="data-price=${p.price},data-name=${p.name}"
                                    th:text="${p.name + ' - Rs. ' + p.price + ' (Stock: ' + p.stockQuantity + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Quantity</label>
                        <input type="number" id="quantityInput" class="form-control" min="1" value="1">
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary w-100" onclick="addPart()"><i class="bi bi-plus-lg"></i> Add</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">Order Items</div>
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead><tr><th>Part</th><th>Quantity</th><th>Unit Price</th><th>Subtotal</th><th></th></tr></thead>
                    <tbody id="orderItemsTable">
                    <tr th:each="item : ${order.items}" class="item-row" th:attr="data-subtotal=${item.subtotal}">
                        <td><span th:text="${item.part.name}"></span>
                            <input type="hidden" data-name="part.id" th:value="${item.part.id}"></td>
                        <td><span th:text="${item.quantity}"></span>
                            <input type="hidden" data-name="quantity" th:value="${item.quantity}"></td>
                        <td th:text="'Rs. ' + ${#numbers.formatDecimal(item.unitPrice,1,'COMMA',2,'POINT')}"></td>
                        <td th:text="'Rs. ' + ${#numbers.formatDecimal(item.subtotal,1,'COMMA',2,'POINT')}"></td>
                        <td class="text-end"><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <label class="form-label">Total Amount (Rs.)</label>
                <input type="text" id="totalAmount" class="form-control" readonly>
                <div class="form-text">Calculated from the current part prices when saved.</div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Order Status</label>
                <select th:field="*{status}" class="form-select">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
                <div class="form-text">Cancelled orders do not hold stock.</div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-accent"><i class="bi bi-check-lg"></i> Save Order</button>
            <a th:href="@{/orders}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>

    <script>
        function money(n) { return n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

        function addPart() {
            const sel = document.getElementById('partSelect');
            const qty = parseInt(document.getElementById('quantityInput').value);
            if (!sel.value) { alert('Please select a part.'); return; }
            if (!qty || qty < 1) { alert('Please enter a valid quantity.'); return; }

            const opt = sel.options[sel.selectedIndex];
            const price = parseFloat(opt.dataset.price);
            const subtotal = price * qty;

            const tr = document.createElement('tr');
            tr.className = 'item-row';
            tr.dataset.subtotal = subtotal;
            tr.innerHTML =
                '<td><span class="part-name"></span><input type="hidden" data-name="part.id"></td>' +
                '<td>' + qty + '<input type="hidden" data-name="quantity"></td>' +
                '<td>Rs. ' + money(price) + '</td>' +
                '<td>Rs. ' + money(subtotal) + '</td>' +
                '<td class="text-end"><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>';
            tr.querySelector('.part-name').textContent = opt.dataset.name;
            tr.querySelector('[data-name="part.id"]').value = sel.value;
            tr.querySelector('[data-name="quantity"]').value = qty;

            document.getElementById('orderItemsTable').appendChild(tr);
            sel.value = '';
            document.getElementById('quantityInput').value = 1;
            updateTotal();
        }

        function removeRow(btn) { btn.closest('tr').remove(); updateTotal(); }

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('#orderItemsTable .item-row').forEach(r => total += parseFloat(r.dataset.subtotal) || 0);
            document.getElementById('totalAmount').value = total.toFixed(2);
        }

        // number the rows 0,1,2... right before submit so the server never sees gaps
        function prepareSubmit() {
            const rows = document.querySelectorAll('#orderItemsTable .item-row');
            if (rows.length === 0) { alert('Add at least one part to the order.'); return false; }
            rows.forEach((row, i) => row.querySelectorAll('input[data-name]').forEach(
                inp => inp.name = 'items[' + i + '].' + inp.dataset.name));
            return true;
        }

        updateTotal();
    </script>

</section>
</body>
</html>
