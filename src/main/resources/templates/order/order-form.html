<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">

<head>
    <title>Order Form</title>
</head>

<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${order.id == null ? 'Create Order' : 'Edit Order'}">
            Create Order
        </h2>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger"
         th:text="${errorMessage}">
    </div>

    <div class="card">
        <div class="card-body">

            <form th:action="@{/orders/save}"
                  th:object="${order}"
                  method="post">

                <!-- Order Number -->
                <div class="mb-3">
                    <label class="form-label">Order Number</label>

                    <input type="text"
                           th:field="*{orderNumber}"
                           class="form-control"
                           placeholder="Enter order number">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('orderNumber')}"
                         th:errors="*{orderNumber}">
                    </div>
                </div>

                <!-- Customer Name -->
                <div class="mb-3">
                    <label class="form-label">Customer Name</label>

                    <input type="text"
                           th:field="*{customerName}"
                           class="form-control"
                           placeholder="Enter customer name">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('customerName')}"
                         th:errors="*{customerName}">
                    </div>
                </div>

                <!-- Customer Email -->
                <div class="mb-3">
                    <label class="form-label">Customer Email</label>

                    <input type="email"
                           th:field="*{customerEmail}"
                           class="form-control"
                           placeholder="Enter customer email">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('customerEmail')}"
                         th:errors="*{customerEmail}">
                    </div>
                </div>

                <!-- Order Date -->
                <div class="mb-3">
                    <label class="form-label">Order Date</label>

                    <input type="datetime-local"
                           th:field="*{orderDate}"
                           class="form-control">

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('orderDate')}"
                         th:errors="*{orderDate}">
                    </div>
                </div>


                <!-- ========================= -->
                <!-- SELECT PART -->
                <!-- ========================= -->

                <div class="card mb-4">
                    <div class="card-header">
                        <strong>Add Spare Parts</strong>
                    </div>

                    <div class="card-body">

                        <div class="row g-3">

                            <!-- Part -->
                            <div class="col-md-8">
                                <label class="form-label">
                                    Select Part
                                </label>

                                <select id="partSelect"
                                        class="form-select">

                                    <option value="">
                                        -- Select a spare part --
                                    </option>

                                    <option th:each="part : ${parts}"
                                            th:value="${part.id}"
                                            th:text="${part.name + ' - Rs. ' + part.price + ' (Stock: ' + part.stockQuantity + ')'}">
                                    </option>

                                </select>
                            </div>

                            <!-- Quantity -->
                            <div class="col-md-4">
                                <label class="form-label">
                                    Quantity
                                </label>

                                <input type="number"
                                       id="quantityInput"
                                       class="form-control"
                                       min="1"
                                       value="1">
                            </div>

                        </div>

                        <button type="button"
                                class="btn btn-primary mt-3"
                                onclick="addPart()">
                            <i class="bi bi-plus-lg"></i>
                            Add Part
                        </button>

                    </div>
                </div>


                <!-- ========================= -->
                <!-- ORDER ITEMS -->
                <!-- ========================= -->

                <div class="card mb-4">

                    <div class="card-header">
                        <strong>Order Items</strong>
                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover mb-0">

                            <thead>
                            <tr>
                                <th>Part</th>
                                <th>Quantity</th>
                                <th>Unit Price</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                            </thead>

                            <tbody id="orderItemsTable">

                            </tbody>

                        </table>

                    </div>

                </div>


                <!-- Total Amount -->
                <div class="mb-3">

                    <label class="form-label">
                        Total Amount
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           th:field="*{totalAmount}"
                           id="totalAmount"
                           class="form-control"
                           readonly>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('totalAmount')}"
                         th:errors="*{totalAmount}">
                    </div>

                </div>


                <!-- Status -->
                <div class="mb-3">

                    <label class="form-label">
                        Order Status
                    </label>

                    <select th:field="*{status}"
                            class="form-select">

                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="SHIPPED">Shipped</option>
                        <option value="DELIVERED">Delivered</option>
                        <option value="CANCELLED">Cancelled</option>

                    </select>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('status')}"
                         th:errors="*{status}">
                    </div>

                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-accent">

                        <i class="bi bi-check-lg"></i>
                        Save Order

                    </button>

                    <a th:href="@{/orders}"
                       class="btn btn-outline-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>
    </div>

</section>


<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script>

    let itemIndex = 0;
    let totalAmount = 0;

    function addPart() {

        const partSelect = document.getElementById("partSelect");
        const quantityInput = document.getElementById("quantityInput");

        const partId = partSelect.value;
        const quantity = parseInt(quantityInput.value);

        if (!partId) {
            alert("Please select a part.");
            return;
        }

        if (!quantity || quantity < 1) {
            alert("Please enter a valid quantity.");
            return;
        }

        const selectedOption =
            partSelect.options[partSelect.selectedIndex];

        const partText = selectedOption.text;

        /*
         * Extract price from option text
         * Example:
         * RAM - Rs. 5000.0 (Stock: 10)
         */

        const priceMatch = partText.match(/Rs\.\s*([\d.]+)/);

        if (!priceMatch) {
            alert("Unable to read part price.");
            return;
        }

        const unitPrice = parseFloat(priceMatch[1]);

        const subtotal = unitPrice * quantity;

        totalAmount += subtotal;

        const table = document.getElementById("orderItemsTable");

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>

                ${partText}

                <input type="hidden"
                       name="items[${itemIndex}].part.id"
                       value="${partId}">

            </td>

            <td>

                ${quantity}

                <input type="hidden"
                       name="items[${itemIndex}].quantity"
                       value="${quantity}">

            </td>

            <td>
                Rs. ${unitPrice.toFixed(2)}

                <input type="hidden"
                       name="items[${itemIndex}].unitPrice"
                       value="${unitPrice}">
            </td>

            <td>
                Rs. ${subtotal.toFixed(2)}
            </td>

            <td>

                <button type="button"
                        class="btn btn-sm btn-outline-danger"
                        onclick="removePart(this, ${subtotal})">

                    <i class="bi bi-trash"></i>

                </button>

            </td>

        `;

        table.appendChild(row);

        itemIndex++;

        updateTotal();

        partSelect.value = "";
        quantityInput.value = 1;
    }


    function removePart(button, subtotal) {

        button.closest("tr").remove();

        totalAmount -= subtotal;

        updateTotal();
    }


    function updateTotal() {

        document.getElementById("totalAmount").value =
            totalAmount.toFixed(2);

    }

</script>

</body>
</html>
