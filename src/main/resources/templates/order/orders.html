<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Orders</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Orders</h2>
        <div>
            <a th:href="@{/orders/history}" class="btn btn-outline-secondary">Customer History</a>
            <a th:href="@{/orders/new}" class="btn btn-accent"><i class="bi bi-plus-lg"></i> Create Order</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th>Order No.</th><th>Customer</th><th>Items</th><th>Order Date</th><th>Total</th><th>Status</th><th>Update Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.orderNumber}"></td>
                    <td><div th:text="${order.customerName}"></div><small class="text-muted" th:text="${order.customerEmail}"></small></td>
                    <td><div th:each="i : ${order.items}" class="small" th:text="${i.part.name + ' x ' + i.quantity}"></div></td>
                    <td th:text="${#temporals.format(order.orderDate,'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="'Rs. ' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}"></td>
                    <td>
                        <span class="badge" th:classappend="${order.status == 'PENDING'} ? 'bg-warning text-dark'
                              : (${order.status == 'CONFIRMED'} ? 'bg-primary'
                              : (${order.status == 'SHIPPED'} ? 'bg-info text-dark'
                              : (${order.status == 'DELIVERED'} ? 'bg-success' : 'bg-danger')))"
                              th:text="${order.status}"></span>
                    </td>
                    <td>
                        <form th:action="@{/orders/status/{id}(id=${order.id})}" method="post" class="d-flex gap-2">
                            <select name="status" class="form-select form-select-sm" style="width: 130px;">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${order.status == s}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Update</button>
                        </form>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/orders/edit/{id}(id=${order.id})}" class="btn btn-sm btn-outline-secondary btn-icon" title="Edit"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/orders/delete/{id}(id=${order.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this order? Its stock will be returned to inventory.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger btn-icon" title="Delete"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}"><td colspan="8" class="text-center py-4">No orders found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
