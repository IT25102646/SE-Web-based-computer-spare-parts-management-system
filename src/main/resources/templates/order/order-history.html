<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Order History</title></head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Customer Order History</h2>
        <a th:href="@{/orders}" class="btn btn-outline-secondary">Back to Orders</a>
    </div>

    <div class="card mb-3"><div class="card-body">
        <form th:action="@{/orders/history}" method="get" class="d-flex gap-2">
            <input type="email" name="email" class="form-control" placeholder="Customer email" th:value="${customerEmail}" required>
            <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Search</button>
        </form>
    </div></div>

    <div class="card" th:if="${customerEmail != null and !#strings.isEmpty(customerEmail)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Order Number</th><th>Order Date</th><th>Total Amount</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.orderNumber}"></td>
                    <td th:text="${#temporals.format(o.orderDate,'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="'Rs. ' + ${#numbers.formatDecimal(o.totalAmount,1,'COMMA',2,'POINT')}"></td>
                    <td th:text="${o.status}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}"><td colspan="4" class="text-center py-4">No previous orders found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</body>
</html>
